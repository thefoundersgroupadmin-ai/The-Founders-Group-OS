# CLIENT BRAND TEMPLATE. Do not edit this file directly:
#   scripts/tfg-new-client.sh <slug> "<Company Name>" "<Operator first name>"
# copies it to config/tfg/clients/<slug>.yaml and fills in the names.
# Lines marked CLIENT: are decided with the client in the kickoff call.

company: __COMPANY__
short: __SHORT__
operator: __OPERATOR__             # CLIENT: the person the console greets (sales lead or owner)
domain: __DOMAIN__
product_name: __SHORT__ Sales OS
product_tagline: Built by The Founders Group
hide_views: [/os/trading, /os/brand-deals, /os/adpilot, /os/social, /os/content]
cohort_invite: false

workspaces:
  founderos: {name: __SHORT__ HQ, holds: "__COMPANY__ HQ: the sales command centre; team, tools, agents, SOPs"}
  vantage: {name: New Business, holds: "New business pipeline: leads, discovery calls, proposals, closes"}
  launchpad-cohort: {name: Existing Accounts, holds: "Existing customers: renewals, expansion, referrals"}
  personal: {name: __OPERATOR__, holds: "__OPERATOR__'s notes and drafts"}

# The client's two pipelines. CLIENT: rename to match how they sell.
ventures:
  vantage:
    label: New Business
    kind: New logos
    color: "#d4a72c"
    detail: Every new-business lead from first touch to signed.
    # CLIENT: words in their intake form or call titles that mean "new business".
    lead_match: "(?i)(demo|discovery|intro|new)"
    focus:
      - "Every lead followed up within 3 days"
      - "Discovery calls recorded and in the Brain"
      - "Proposals out within 48 hours of the call"
    area_agents:
      sales: [tfg-pipeline-sdr, tfg-crm-hygiene, sales-agent, sales-calls-data]
      communication: [comms-agent, gmail-worker, slack-worker]
      finances: [payments-pulse, stripe-sales]
      marketing: [newsletter-agent]
      clients: [client-roster, client-onboarding, client-success]
      operations: [conductor, stack-monitor, tfg-impact-reporter]
      knowledge: [data-agent, markdown-auditor, vector-auditor]
  launchpad-cohort:
    label: Existing Accounts
    kind: Renewals and expansion
    color: "#4c8dff"
    detail: Customers already signed: renewals, upsells, referrals.
    focus:
      - "No renewal reaches its date without a conversation"
      - "Every happy customer asked for a referral"
      - "Weekly impact report reviewed with TFG"
    area_agents:
      sales: [tfg-pipeline-sdr, tfg-crm-hygiene, sales-agent]
      communication: [comms-agent, gmail-worker, slack-worker]
      finances: [payments-pulse, stripe-sales]
      marketing: [newsletter-agent]
      clients: [client-roster, client-success]
      operations: [conductor, stack-monitor, tfg-impact-reporter]
      knowledge: [data-agent, markdown-auditor, vector-auditor]

impact:
  minutes_per_successful_run: 6     # CLIENT: agree this number with them; it drives the hours they see
